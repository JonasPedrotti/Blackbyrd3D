name: Build Linux AppImage

# Builds the AppImage with packaging/appimage/build-appimage.sh, which also
# starts the packed app under a virtual display before anything is published.
# - workflow_dispatch: build and expose the AppImage as a downloadable artifact.
# - release published: also attach it to that release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'JonasPedrotti/Blackbyrd3D'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for Qt, OpenGL and the window check
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Build AppImage
        env:
          # appimagetool is itself an AppImage, and the runner has no FUSE
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/appimage/build-appimage.sh
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackbyrd3D-x86_64.AppImage
          path: packaging/appimage/dist/Blackbyrd3D-x86_64.AppImage
          if-no-files-found: error
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          if grep -Fxq "Blackbyrd3D-x86_64.AppImage" <<< "$assets"; then
            echo 'Keeping the AppImage already prepared in the draft release.'
          else
            gh release upload "$tag" packaging/appimage/dist/Blackbyrd3D-x86_64.AppImage
          fi
