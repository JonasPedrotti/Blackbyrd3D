name: Build Linux AppImage

# Builds the AppImage with packaging/appimage/build-appimage.sh, which also
# starts the packed app under a virtual display before anything is published.
# One job per architecture, each on a runner of its own kind: python-appimage
# builds for the machine it runs on.
# - workflow_dispatch: build and expose the AppImage as a downloadable artifact.
# - release published: also attach it to that release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'JonasPedrotti/Blackbyrd3D'
    strategy:
      # a broken ARM build must not hold back the x86_64 one
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGE_NAME: Blackbyrd3D-${{ matrix.arch }}.AppImage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: System libraries for Qt, OpenGL and the window check
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Build AppImage
        env:
          # appimagetool is itself an AppImage, and the runner has no FUSE
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/appimage/build-appimage.sh
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: packaging/appimage/dist/${{ env.APPIMAGE_NAME }}
          if-no-files-found: error
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          if grep -Fxq "$APPIMAGE_NAME" <<< "$assets"; then
            echo 'Keeping the AppImage already prepared in the draft release.'
          else
            gh release upload "$tag" "packaging/appimage/dist/$APPIMAGE_NAME"
          fi
