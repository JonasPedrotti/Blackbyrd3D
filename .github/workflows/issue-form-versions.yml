name: Issue form versions

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Put the three latest releases into the bug report form
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(gh release list --exclude-drafts --exclude-pre-releases --limit 3 \
            --json tagName --jq '.[].tagName | ltrimstr("v")')
          [ -n "$versions" ] || exit 0
          python3 - $versions <<'EOF'
          import re, sys
          path = ".github/ISSUE_TEMPLATE/bug_report.yml"
          items = "".join(f'        - "{v}"\n' for v in sys.argv[1:])
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"(# versions:start[^\n]*\n).*?( *# versions:end)",
                        lambda m: m.group(1) + items + m.group(2), text, flags=re.S)
          open(path, "w", encoding="utf-8").write(text)
          EOF
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bug report form: latest versions"
          git push
